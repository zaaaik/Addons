name: Generar base de datos

on:
  push:
    paths:
      - "capturas/**"
      - "data/revisiones.json"
      - "tools/**"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # cada lunes: recoge poco a poco las misiones nuevas de Wowhead

permissions:
  contents: write

concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Caché (SQL de AzerothCore, modelo de Argos, pip)
        uses: actions/cache@v4
        with:
          path: |
            data/.cache
            !data/.cache/wowhead/lists
            ~/.local/share/argos-translate
            ~/.cache/pip
          key: build-data-${{ hashFiles('tools/importers/azerothcore.py') }}-${{ github.run_id }}
          restore-keys: build-data-${{ hashFiles('tools/importers/azerothcore.py') }}-

      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate

      - name: Tests de herramientas
        run: python -m unittest discover -s tools/tests -v

      - name: Importar y traducir
        run: python tools/build_db.py --engine argos --wowhead --wowhead-max 300 --wowhead-refresh-list

      - name: Smoke test del addon con los datos nuevos
        run: python tools/tests/run_smoke.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data MisionesES/Data
          if git diff --cached --quiet; then
            echo "Sin cambios en la base de datos."
          else
            git commit -m "Actualizar base de datos de traducciones"
            git push
          fi
